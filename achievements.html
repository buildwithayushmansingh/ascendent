                <div>
                    <h2>Achievements</h2>

        </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/demo-data.js"></script>
    <script src="js/rewards.js"></script>
    <script src="js/achievements.js"></script>
    <script>
        function renderAchievements() {
            const user = getDemoUser();
            checkAchievements(user); // catch any newly-met conditions on page load too
            const stats = getAchievementStats(user);

            document.getElementById('achievementGrid').innerHTML = ACHIEVEMENT_LIST.map((ach) => {
                const unlocked = user.unlockedAchievements.includes(ach.id);
                return `
          <div class="achievement-card ${unlocked ? 'unlocked' : 'locked'}">
            <div class="achievement-icon">${unlocked ? ach.icon : '🔒'}</div>
            <div class="achievement-name">${ach.name}</div>
            <div class="achievement-desc">${ach.description}</div>
            ${unlocked ? '<div class="achievement-badge">Unlocked</div>' : '<div class="achievement-badge locked-badge">Locked</div>'}
          </div>
        `;
            }).join('');
        }

        document.getElementById('logoutBtn').addEventListener('click', logoutUser);

        renderAchievements();
    </script>
    <script src="js/sidebar-tilt.js"></script>
