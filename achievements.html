<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascendent — Achievements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
</head>

<body>
    <div class="app-layout">
        <aside class="sb" id="appSidebar"></aside>

        <main class="main-content">
            <header class="content-topbar">
                <div>
                    <h2>Achievements</h2>
                    <p class="subtext">Unlock badges as you build your legend.</p>
                </div>
                <button id="logoutBtn" class="ghost-btn">Log Out</button>
            </header>

            <!-- Achievement level hero -->
            <section class="ach-hero">
                <div class="ach-hero-ring" id="achHeroRing">
                    <div class="ach-hero-inner">
                        <span id="achHeroCount">0/0</span>
                        <small>Unlocked</small>
                    </div>
                </div>
                <div class="ach-hero-text">
                    <h3>Achievement Progress</h3>
                    <p class="subtext">Every badge tells part of your story.</p>
                </div>
            </section>

            <div class="ach-filter-tabs">
                <button class="ach-tab active" data-filter="all">All</button>
                <button class="ach-tab" data-filter="unlocked">Unlocked</button>
                <button class="ach-tab" data-filter="locked">Locked</button>
            </div>

            <div id="achievementGrid" class="achievement-grid-v2"></div>
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/demo-data.js"></script>
  <script src="js/sidebar.js"></script>
    <script src="js/rewards.js"></script>
    <script src="js/achievements.js"></script>
    <script>
        let achFilter = 'all';

        function renderAchievements() {
            const user = getDemoUser();
            checkAchievements(user);

            const total = ACHIEVEMENT_LIST.length;
            const unlockedCount = user.unlockedAchievements.length;
            const pct = Math.round((unlockedCount / total) * 100);

            document.getElementById('achHeroRing').style.setProperty('--pct', pct);
            document.getElementById('achHeroCount').textContent = `${unlockedCount}/${total}`;

            const visible = ACHIEVEMENT_LIST.filter((ach) => {
                const unlocked = user.unlockedAchievements.includes(ach.id);
                if (achFilter === 'unlocked') return unlocked;
                if (achFilter === 'locked') return !unlocked;
                return true;
            });

            document.getElementById('achievementGrid').innerHTML = visible.map((ach) => {
                const unlocked = user.unlockedAchievements.includes(ach.id);
                return `
          <div class="ach-badge-card ${unlocked ? 'unlocked' : 'locked'}">
            <div class="ach-badge-ring">
              <div class="ach-badge-icon">${unlocked ? ach.icon : '🔒'}</div>
            </div>
            <div class="ach-badge-name">${ach.name}</div>
            <div class="ach-badge-desc">${ach.description}</div>
            <div class="ach-badge-pill ${unlocked ? '' : 'locked-pill'}">${unlocked ? 'Unlocked' : 'Locked'}</div>
          </div>
        `;
            }).join('');
        }

        document.querySelectorAll('.ach-tab').forEach((tab) => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.ach-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                achFilter = tab.dataset.filter;
                renderAchievements();
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', logoutUser);

        renderAchievements();
    </script>
</body>

</html>
