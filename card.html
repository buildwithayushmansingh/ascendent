<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ascendent — Player Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="js/theme.js"></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/card-themes.css" />
</head>

<body>

  <!-- Existing animated background stays untouched -->
  <div class="card-page">

    <div class="card-page-header">

      <a href="dashboard.html" class="back-link">
        ← Back to Dashboard
      </a>

      <section class="card-theme-section">
        <span class="card-theme-label">CARD THEME</span>

        <div class="card-theme-selector" id="cardThemeSelector">

          <button type="button" class="card-theme-btn" data-card-theme="holographic">
            <span class="theme-dot holographic-dot"></span>
            Holographic
          </button>

          <button type="button" class="card-theme-btn" data-card-theme="warrior">
            <span class="theme-dot warrior-dot"></span>
            Warrior
          </button>

          <button type="button" class="card-theme-btn" data-card-theme="cosmic">
            <span class="theme-dot cosmic-dot"></span>
            Cosmic
          </button>

          <button type="button" class="card-theme-btn" data-card-theme="minimal">
            <span class="theme-dot minimal-dot"></span>
            Minimal
          </button>

        </div>
      </section>

    </div>

    <main class="card-main">

      <div class="flip-container">
        <div id="flipInner" class="flip-inner">

          <div id="playerCard" class="player-card tier-gold flip-front" data-card-theme="holographic">
          </div>

          <div id="futureSelfCard" class="player-card tier-gold flip-back" data-card-theme="holographic">
          </div>

        </div>
      </div>

      <div class="card-actions">

        <button id="flipCardBtn" class="card-action-btn primary-card-btn">
          🔮 View Future Self
        </button>

        <button id="shareCardBtn" class="ghost-btn">
          🔗 Share Card
        </button>

        <button id="downloadCardBtn" class="ghost-btn">
          ↓ Download Card
        </button>

        <button id="profileLinkBtn" class="ghost-btn">
          👤 Profile Link
        </button>

      </div>

    </main>

  </div>

  <!-- Toast -->
  <div id="toastContainer" class="toast-container"></div>


  <!-- Existing JS -->
  <script src="js/demo-data.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/card.js"></script>
  <script src="js/sidebar-tilt.js"></script>

</body>

</html>
