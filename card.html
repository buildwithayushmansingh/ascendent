<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ascendent — Player Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="js/theme.js"></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/card-premium.css" />
  <link rel="stylesheet" href="css/card-3d.css" />
  <link rel="stylesheet" href="css/card-themes.css" />
</head>

<body>

  <!-- Existing animated background stays untouched -->
  <div class="card-page">

    <div class="card-page-header">

      <a href="dashboard.html" class="back-link">
        ← Back to Dashboard
      </a>


    </div>

    <main class="card-main">

      <div class="flip-container">
        <div id="flipInner" class="flip-inner">

          <div id="playerCard" class="player-card tier-gold flip-front" data-card-theme="holographic">
          </div>

          <div id="futureSelfCard" class="player-card tier-gold flip-back" data-card-theme="holographic">
          </div>

        </div>
      </div>

      <div class="card-controls">

        <!-- CARD THEME -->
        <section class="ctl-panel">
          <div class="ctl-title"><span>Card Theme</span><small>Pick a style for your card</small></div>

          <div class="ctl-grid" id="cardThemeSelector">

            <button type="button" class="card-theme-btn theme-box" data-card-theme="holographic" aria-pressed="false">
              <span class="tb-preview tb-holographic"><i></i><b></b><b></b></span>
              <span class="tb-name">Holographic</span>
              <span class="tb-desc">Glass &amp; rainbow shine</span>
              <span class="tb-check">✓</span>
            </button>

            <button type="button" class="card-theme-btn theme-box" data-card-theme="warrior" aria-pressed="false">
              <span class="tb-preview tb-warrior"><i></i><b></b><b></b></span>
              <span class="tb-name">Warrior</span>
              <span class="tb-desc">Fiery &amp; bold</span>
              <span class="tb-check">✓</span>
            </button>

            <button type="button" class="card-theme-btn theme-box" data-card-theme="cosmic" aria-pressed="false">
              <span class="tb-preview tb-cosmic"><i></i><b></b><b></b></span>
              <span class="tb-name">Cosmic</span>
              <span class="tb-desc">Deep space glow</span>
              <span class="tb-check">✓</span>
            </button>

            <button type="button" class="card-theme-btn theme-box" data-card-theme="minimal" aria-pressed="false">
              <span class="tb-preview tb-minimal"><i></i><b></b><b></b></span>
              <span class="tb-name">Minimal</span>
              <span class="tb-desc">Clean monochrome</span>
              <span class="tb-check">✓</span>
            </button>

          </div>
        </section>

        <!-- ACTIONS -->
        <section class="ctl-panel">
          <div class="ctl-title"><span>Actions</span><small>Flip, share or save your card</small></div>

          <div class="ctl-grid">

            <button id="flipCardBtn" type="button" class="action-box action-primary">
              <span class="ca-icon">🔮</span>
              <span class="ca-text"><b class="ca-title">Future Self</b><small class="ca-sub">Flip the
                  card</small></span>
            </button>

            <button id="shareCardBtn" type="button" class="action-box">
              <span class="ca-icon">🔗</span>
              <span class="ca-text"><b class="ca-title">Share Card</b><small class="ca-sub">Send to
                  friends</small></span>
            </button>

            <button id="downloadCardBtn" type="button" class="action-box">
              <span class="ca-icon">⬇️</span>
              <span class="ca-text"><b class="ca-title">Download</b><small class="ca-sub">Save as image</small></span>
            </button>

            <button id="profileLinkBtn" type="button" class="action-box">
              <span class="ca-icon">👤</span>
              <span class="ca-text"><b class="ca-title">Profile Link</b><small class="ca-sub">Copy your
                  link</small></span>
            </button>

          </div>
        </section>

      </div>

    </main>

  </div>

  <!-- Toast -->
  <div id="toastContainer" class="toast-container"></div>


  <!-- Existing JS -->
  <script src="js/demo-data.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/card-3d.js"></script>
  <script src="js/card-premium.js"></script>
  <script src="js/card.js"></script>
  <script src="js/sidebar-tilt.js"></script>

</body>

</html>
