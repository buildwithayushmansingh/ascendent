<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascendent — Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
</head>

<body>
    <div class="app-layout">
        <aside class="sb" id="appSidebar"></aside>

        <main class="main-content">
            <header class="content-topbar">
                <div>
                    <h2>Calendar</h2>
                    <p class="subtext">Your entire consistency history, day by day.</p>
                </div>
                <button id="logoutBtn" class="ghost-btn">Log Out</button>
            </header>

            <!-- Monthly summary -->
            <section class="cal-summary" id="calSummary"></section>

            <div class="cal-layout">
                <!-- Calendar -->
                <section class="cal-panel">
                    <div class="cal-header">
                        <button id="calPrevBtn" class="cal-nav-btn">←</button>
                        <h3 id="calMonthLabel">Month Year</h3>
                        <button id="calNextBtn" class="cal-nav-btn">→</button>
                        <button id="calTodayBtn" class="cal-today-btn">Today</button>
                    </div>
                    <div class="cal-weekdays">
                        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                    </div>
                    <div id="calGrid" class="cal-grid"></div>
                </section>

                <!-- Daily status panel -->
                <section class="cal-daily-panel" id="calDailyPanel">
                    <div class="cal-daily-empty">
                        <div class="cal-daily-empty-icon">📅</div>
                        <p>Click a date to see what happened that day.</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/demo-data.js"></script>
  <script src="js/sidebar.js"></script>
    <script src="js/calendar.js"></script>
</body>

</html>
