<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascendent — Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">⚔ Ascendent</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-tile">
                    <span class="nav-tile-icon">🏠</span>
                    <span class="nav-tile-text"><span class="nav-tile-title">Dashboard</span><span
                            class="nav-tile-desc">Home base</span></span>
                    <span class="nav-tile-indicator"></span>
                </a>
                <a href="habits.html" class="nav-tile">
                    <span class="nav-tile-icon">📋</span>
                    <span class="nav-tile-text"><span class="nav-tile-title">Habits</span><span
                            class="nav-tile-desc">Track quests</span></span>
                    <span class="nav-tile-indicator"></span>
                </a>
                <a href="achievements.html" class="nav-tile">
                    <span class="nav-tile-icon">🏆</span>
                    <span class="nav-tile-text"><span class="nav-tile-title">Achievements</span><span
                            class="nav-tile-desc">Unlocked badges</span></span>
                    <span class="nav-tile-indicator"></span>
                </a>
                <a href="card.html" class="nav-tile">
                    <span class="nav-tile-icon">🎴</span>
                    <span class="nav-tile-text"><span class="nav-tile-title">Player Card</span><span
                            class="nav-tile-desc">Your identity</span></span>
                    <span class="nav-tile-indicator"></span>
                </a>
                <a href="progress.html" class="nav-tile">
                    <span class="nav-tile-icon">📈</span>
                    <span class="nav-tile-text"><span class="nav-tile-title">Progress</span><span
                            class="nav-tile-desc">Analytics</span></span>
                    <span class="nav-tile-indicator"></span>
                </a>
                <a href="leaderboard.html" class="nav-tile nav-active">
                    <span class="nav-tile-icon">📊</span>
                    <span class="nav-tile-text"><span class="nav-tile-title">Leaderboard</span><span
                            class="nav-tile-desc">Global ranks</span></span>
                    <span class="nav-tile-indicator"></span>
                </a>
                <a href="settings.html" class="nav-tile">
                    <span class="nav-tile-icon">⚙️</span>
                    <span class="nav-tile-text"><span class="nav-tile-title">Settings</span><span
                            class="nav-tile-desc">Preferences</span></span>
                    <span class="nav-tile-indicator"></span>
                </a>
            </nav>
            <div class="sidebar-quote">"Discipline today,<br>freedom tomorrow."</div>
        </aside>

        <main class="main-content">
            <header class="content-topbar">
                <div>
                    <h2>Leaderboard</h2>
                    <p class="subtext">See how you rank among other players.</p>
                </div>
                <button id="logoutBtn" class="ghost-btn">Log Out</button>
            </header>

            <div class="leaderboard-tabs">
                <button class="lb-tab active" data-tab="global">🌍 Global</button>
                <button class="lb-tab" data-tab="friends">👥 Friends</button>
                <button class="lb-tab" data-tab="squad">⚔️ Squad</button>
            </div>

            <!-- Rank-1 spotlight -->
            <section class="lb-spotlight" id="lbSpotlight"></section>

            <!-- Rest of the ranked list -->
            <div id="leaderboardList" class="lb-rank-list"></div>
        </main>
    </div>

    <script src="js/demo-data.js"></script>
    <script src="js/leaderboard-data.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/sidebar-tilt.js"></script>
</body>

</html>
