<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascendent — Progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
</head>

<body>
    <div class="app-layout">
        <aside class="sb" id="appSidebar"></aside>

        <main class="main-content">
            <header class="content-topbar">
                <div>
                    <h2>Progress</h2>
                    <p class="subtext">Your consistency, visualized.</p>
                </div>
                <button id="logoutBtn" class="ghost-btn">Log Out</button>
            </header>

            <!-- Hero ring -->
            <section class="progress-hero">
                <div class="progress-hero-ring" id="heroRing">
                    <div class="progress-hero-inner">
                        <span id="heroRingPct">0%</span>
                        <small>Consistency</small>
                    </div>
                </div>
                <div class="progress-hero-stats">
                    <div class="hero-stat-item"><span class="hero-stat-icon">✨</span>
                        <div>
                            <div class="hero-stat-label">Weekly XP</div>
                            <div id="weeklyXPStat" class="hero-stat-value">0</div>
                        </div>
                    </div>
                    <div class="hero-stat-item"><span class="hero-stat-icon">🔥</span>
                        <div>
                            <div class="hero-stat-label">Current Streak</div>
                            <div id="currentStreakStat" class="hero-stat-value">0</div>
                        </div>
                    </div>
                    <div class="hero-stat-item"><span class="hero-stat-icon">🏔️</span>
                        <div>
                            <div class="hero-stat-label">Best Streak</div>
                            <div id="bestStreakStat" class="hero-stat-value">0</div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="progress-panel">
                <h3>Activity — last 7 days (XP)</h3>
                <div id="weeklyChart" class="weekly-chart"></div>
            </section>

            <section class="progress-panel">
                <h3>Activity Heatmap</h3>
                <div id="heatmapRow" class="heatmap-row"></div>
            </section>

            <section class="progress-panel">
                <h3>Course Progress</h3>
                <div id="categoryProgress" class="ring-course-list"></div>
            </section>

            <div class="content-grid">
                <section class="progress-panel">
                    <h3>Weekly Recap</h3>
                    <div id="weeklyRecap" class="recap-box"></div>
                </section>
                <section class="progress-panel">
                    <h3>Excuse History</h3>
                    <div id="excuseHistory" class="excuse-list"></div>
                </section>
            </div>

            <section class="progress-panel">
                <h3>Card Evolution</h3>
                <div id="cardEvolution" class="evolution-list"></div>
            </section>
        </main>
    </div>

    <script src="js/demo-data.js"></script>
  <script src="js/sidebar.js"></script>
    <script src="js/progress.js"></script>
</body>

</html>
