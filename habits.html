<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ascendent — Habits</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
</head>

<body>

    <div class="app-layout">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sb" id="appSidebar"></aside>


        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content frontier-main">

            <div class="frontier-vignette" aria-hidden="true"></div>


            <!-- ================= HEADER ================= -->

            <header class="frontier-header">

                <!-- LEFT SIDE: AVATAR + TITLE -->
                <div class="frontier-header-main">

                    <!-- PROFILE AVATAR -->
                    <div class="global-page-profile">

                        <div class="global-profile-avatar" id="habitsProfileAvatar">
                            <span>AS</span>
                        </div>

                    </div>


                    <!-- HABITS TITLE -->
                    <div class="frontier-header-left">

                        <div>

                            <h2 class="frontier-title">
                                My Habits
                            </h2>

                            <p class="frontier-subtitle">
                                Every quest logged, every bounty tracked.
                            </p>

                        </div>

                    </div>

                </div>


                <!-- RIGHT SIDE BUTTONS -->

                <div class="habits-header-actions">

                    <button id="addHabitBtn" class="frontier-add-btn">
                        ➕ New Bounty
                    </button>

                    <button id="logoutBtn" class="frontier-seal-btn">
                        Log Out
                    </button>

                </div>

            </header>


            <!-- ================= HERO STATS ================= -->

            <section class="habit-hero-stats" id="habitHeroStats"></section>


            <!-- ================= HABIT GRID ================= -->

            <div id="habitList" class="habit-grid-v2">
                <!-- filled in by habits.js -->
            </div>


            <!-- ================= HABIT LIST ================= -->

            <div id="habitList" class="habit-list frontier-habit-list">
                <!-- filled in by habits.js — unchanged -->
            </div>

        </main>

    </div>


    <!-- ================= COMPLETE QUEST MODAL ================= -->

    <div id="completeModal" class="modal-overlay">

        <div class="modal-box frontier-modal">

            <span class="frontier-stamp modal-stamp">
                SEALED
            </span>

            <h3>
                Complete Quest
            </h3>

            <div id="completeModalBody"></div>

            <div class="modal-actions">

                <button class="ghost-btn" data-close-modal>
                    Cancel
                </button>

                <button id="confirmCompleteBtn" class="primary-wide-btn">
                    Complete Quest
                </button>

            </div>

        </div>

    </div>


    <!-- ================= MISSED ACTIVITY MODAL ================= -->

    <div id="missModal" class="modal-overlay">

        <div class="modal-box frontier-modal">

            <span class="frontier-stamp modal-stamp duel-stamp">
                MISSED
            </span>

            <h3>
                Why did you miss it?
            </h3>

            <div id="missReasonOptions" class="reason-options">

                <button type="button" class="reason-tile" data-reason="Busy">
                    Busy
                </button>

                <button type="button" class="reason-tile" data-reason="Tired">
                    Tired
                </button>

                <button type="button" class="reason-tile" data-reason="Forgot">
                    Forgot
                </button>

                <button type="button" class="reason-tile" data-reason="No motivation">
                    No motivation
                </button>

                <button type="button" class="reason-tile" data-reason="Other">
                    Other
                </button>

            </div>


            <div id="missImpactBox" style="display:none;">

                <p id="missImpactText" class="message" style="color:var(--text-secondary);"></p>

                <button id="useShieldBtn" class="primary-wide-btn">
                    🛡 Use Streak Shield
                </button>

                <button id="confirmMissBtn" class="ghost-btn" style="width:100%; margin-top:8px;">
                    Continue Without Shield
                </button>

            </div>

        </div>

    </div>


    <!-- ================= ADD / EDIT HABIT MODAL ================= -->

    <div id="habitFormModal" class="modal-overlay">

        <div class="modal-box frontier-modal">

            <span class="frontier-stamp modal-stamp journal-stamp">
                NEW ENTRY
            </span>

            <h3 id="habitFormTitle">
                Add Habit
            </h3>


            <label class="field-label">
                Habit Name
            </label>

            <input type="text" id="habitNameInput" placeholder="e.g. Guitar Practice" />


            <label class="field-label">
                Icon (emoji)
            </label>

            <input type="text" id="habitIconInput" placeholder="🎸" maxlength="2" />


            <label class="field-label">
                Target (minutes/day)
            </label>

            <input type="number" id="habitTargetInput" min="5" value="30" />


            <label class="field-label">
                Frequency (days/week)
            </label>

            <input type="number" id="habitFrequencyInput" min="1" max="7" value="5" />


            <label class="field-label">
                Difficulty
            </label>

            <select id="habitDifficultyInput">

                <option value="Easy" data-xp="10">
                    Easy — +10 XP
                </option>

                <option value="Normal" data-xp="20" selected>
                    Normal — +20 XP
                </option>

                <option value="Hard" data-xp="35">
                    Hard — +35 XP
                </option>

                <option value="Extreme" data-xp="50">
                    Extreme — +50 XP
                </option>

            </select>


            <div class="modal-actions">

                <button class="ghost-btn" data-close-modal>
                    Cancel
                </button>

                <button id="saveHabitBtn" class="primary-wide-btn">
                    Create Habit
                </button>

            </div>

        </div>

    </div>


    <div id="toastContainer" class="toast-container"></div>


    <!-- ================= SCRIPTS ================= -->

    <script src="js/demo-data.js"></script>
  <script src="js/sidebar.js"></script>
    <script src="js/rewards.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/habits.js"></script>

    <script>
        // Apply saved profile image
        applyAvatarImage('#habitsProfileAvatar');
    </script>

</body>

</html>
